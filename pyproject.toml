[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "t800-lab"
version = "0.1.0"
description = "T800 walking AMP training and compatible impact robustness continuation"
requires-python = ">=3.11,<3.12"
license = {file = "LICENSE"}

[tool.setuptools.packages.find]
where = ["source/t800_lab"]

[tool.setuptools.package-data]
t800_lab = ["assets/resources/t800/**/*", "tasks/t800_base/amp_dataset/*.npz", "tasks/t800_base/amp_dataset/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.pyright]
pythonVersion = "3.11"
extraPaths = ["source/t800_lab"]
include = ["scripts/cusrl/bootstrap.py", "scripts/cusrl/terrain_play.py", "source/t800_lab/t800_lab/utils/wrappers/cusrl/checkpoint.py"]
typeCheckingMode = "basic"
